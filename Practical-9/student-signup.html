
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">

        <nav class="navbar">

            <div class="logo">

                <img src="https://img.icons8.com/bubbles/1200/charotar-university.jpg"
                     alt="University Logo"
                     width="50"
                     height="50">

                <h2>Student Hub</h2>

            </div>

        </nav>

        <div class="nav">

            <a href="student_auth.html" class="nav-btn">
                Back
            </a>

        </div>

    </header>


    <h1>Student Registration</h1>

    <p class="registration-subtitle">
        Create your Student Hub account.
    </p>


    <!-- REGISTRATION FORM -->

    <form class="student-form"
          id="registrationForm"
          action="student-signup.php"
          method="POST"
          novalidate>

        <h2>Student Registration</h2>


        <!-- FULL NAME -->

        <label for="name">Full Name</label>

        <input type="text"
               id="name"
               name="name"
               placeholder="Enter your full name"
               minlength="3"
               maxlength="50"
               pattern="[A-Za-z ]{3,50}"
               autocomplete="name"
               required>

        <span id="nameError" aria-live="polite"></span>

        <!-- USERNAME -->

        <label for="username">Username</label>

        <input type="text"
               id="username"
               name="username"
               placeholder="Choose a username"
               minlength="3"
               maxlength="30"
               pattern="[A-Za-z0-9_]{3,30}"
               autocomplete="username"
               required>

        <span id="usernameError" aria-live="polite"></span>


        <!-- EMAIL -->

        <label for="email">Email Address</label>

        <input type="email"
               id="email"
               name="email"
               placeholder="Enter your email"
               maxlength="254"
               autocomplete="email"
               required>

        <span id="emailError" aria-live="polite"></span>


        <!-- PHONE NUMBER -->

        <label for="mobile">Phone Number</label>

        <input type="tel"
               id="mobile"
               name="mobile"
               placeholder="Enter your phone number"
               inputmode="numeric"
               pattern="[6-9][0-9]{9}"
               autocomplete="tel"
               required>

        <span id="mobileError" aria-live="polite"></span>


        <!-- PASSWORD -->

        <label for="password">Password</label>

        <input type="password"
               id="password"
               name="password"
               placeholder="Create password"
               minlength="8"
               maxlength="72"
               autocomplete="new-password"
               required>

        <span id="passwordError"></span>


        <!-- CONFIRM PASSWORD -->

        <label for="confirmPassword">Confirm Password</label>

        <input type="password"
               id="confirmPassword"
               name="confirmPassword"
               placeholder="Confirm password"
               maxlength="72"
               autocomplete="new-password"
               required>

        <span id="confirmPasswordError"></span>


        <!-- COURSE -->

        <label>Course</label>

        <select id="course" name="course" required>

            <option value="">Select Course</option>

            <option value="BCA">BCA</option>
            <option value="BBA">BBA</option>
            <option value="B.Tech">B.Tech</option>
            <option value="MCA">MCA</option>

        </select>

        <span id="courseError"></span>


        <!-- YEAR -->

        <label>Year</label>

        <select id="year" name="year" required>

            <option value="">Select Year</option>

            <option value="1">First Year</option>
            <option value="2">Second Year</option>
            <option value="3">Third Year</option>
            <option value="4">Fourth Year</option>

        </select>

        <span id="yearError"></span>


        <!-- GENDER -->

        <label>Gender</label>

        <input type="radio"
               name="gender"
               value="Male"
               required>

        Male

        <input type="radio"
               name="gender"
               value="Female">

        Female

        <input type="radio"
               name="gender"
               value="Other">

        Other

        <span id="genderError"></span>


        <!-- TERMS -->

        <label>

            <input type="checkbox"
                   id="terms"
                   name="terms"
                   value="accepted"
                   required>

            I accept Terms and Conditions

        </label>

        <span id="termsError"></span>


        <!-- REGISTER BUTTON -->

        <button type="submit">
            Register
        </button>


        <p>
            Already have an account?

            <a href="student-login.html">
                Login
            </a>
        </p>

    </form>


    <footer>

        <p>© 2026 Student Hub Portal</p>

    </footer>


    <!-- JAVASCRIPT -->

    <script src="../js/registration.js"></script>

</body>

</html>
