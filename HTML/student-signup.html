<!DOCTYPE html>
<html lang="en">
<link rel="stylesheet" href="../css/style.css">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <center>

        <!-- University Logo -->

        <img src="https://img.icons8.com/bubbles/1200/charotar-university.jpg"
             alt="University Logo"
             width="120">

        <h1>STUDENT HUB PORTAL</h1>

        <hr>

        <h2>Student Registration</h2>

        <p>Create your Student Hub account.</p>

        <form>

            <table cellpadding="8">

                <tr>
                    <td>Full Name</td>
                </tr>

                <tr>
                    <td>
                        <input type="text"
                               placeholder="Enter Full Name"
                               required>
                    </td>
                </tr>

                <tr>
                    <td>Enrollment Number</td>
                </tr>

                <tr>
                    <td>
                        <input type="text"
                               placeholder="Enter Enrollment Number"
                               required>
                    </td>
                </tr>

                <tr>
                    <td>Email Address</td>
                </tr>

                <tr>
                    <td>
                        <input type="email"
                               placeholder="Enter Email"
                               required>
                    </td>
                </tr>

                <tr>
                    <td>Mobile Number</td>
                </tr>

                <tr>
                    <td>
                        <input type="tel"
                               placeholder="Enter Mobile Number"
                               required>
                    </td>
                </tr>

                <tr>
                    <td>Password</td>
                </tr>

                <tr>
                    <td>
                        <input type="password"
                               placeholder="Create Password"
                               required>
                    </td>
                </tr>

                <tr>
                    <td>Confirm Password</td>
                </tr>

                <tr>
                    <td>
                        <input type="password"
                               placeholder="Confirm Password"
                               required>
                    </td>
                </tr>

            </table>

            <br>

            <a href="student-dashboard.html">
    <button type="button">
        CREATE ACCOUNT
    </button>
</a>

        </form>

        <br>

        <p>Already have an account?</p>

        <a href="student-login.html">
            <button type="button">
                LOGIN
            </button>
        </a>

        <br><br>

        <a href="student_auth.html">
            <button type="button">
                ← Back
            </button>
        </a>

    </center>

</body>

</html>
